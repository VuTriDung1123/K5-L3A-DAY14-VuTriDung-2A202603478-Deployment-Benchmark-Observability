name: Agent Eval Quality Gate

on:
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: 06-lab-complete/benchmark-observability/develop
        run: pip install -r requirements.txt

      - name: Run agent v2 and execute eval quality gate
        working-directory: 06-lab-complete/benchmark-observability/develop
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8002 python app.py &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8002/health >/dev/null; then break; fi
            sleep 0.5
          done
          python eval/run_eval.py --url http://localhost:8002 --min-accuracy 0.85 --out reports/eval_ci.json
          STATUS=$?
          kill -TERM "$SERVER_PID" 2>/dev/null || true
          exit "$STATUS"
